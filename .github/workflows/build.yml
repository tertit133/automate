name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows:
    name: Windows / .NET 8 x64
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore (win-x64)
        run: dotnet restore AutoMate.csproj -r win-x64

      - name: Publish (framework-dependent, win-x64)
        run: dotnet publish AutoMate.csproj --no-restore -c Release -r win-x64 --self-contained false -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: automate-x64-release
          path: publish/
          if-no-files-found: warn
